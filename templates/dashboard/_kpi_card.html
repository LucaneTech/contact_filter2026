{% load static tailwind_tags %}
{% load static %}
{% load lucide %}

<div class="group relative overflow-hidden rounded-2xl border border-white/10 bg-gradient-to-br from-slate-800/90 to-slate-900/95 p-5
            backdrop-blur-sm shadow-xl hover:shadow-2xl hover:-translate-y-0.5 transition-all duration-300">
    <div class="absolute inset-0 bg-gradient-to-br from-{{ color }}-500/5 to-{{ color }}-600/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
    <div class="relative flex items-center justify-between mb-4">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-{{ color }}-500/15 ring-1 ring-{{ color }}-500/20
                     group-hover:bg-{{ color }}-500/25 transition-all">
            {% lucide icon class="w-5 h-5 text-"|add:color|add:"-400" %}
        </span>
        <span class="text-[10px] font-semibold uppercase tracking-widest text-slate-500">{{ label }}</span>
    </div>
    <p class="relative text-2xl font-bold tracking-tight text-{{ color }}-400">{{ value }}</p>
    {% if sub %}<p class="relative mt-1.5 text-xs text-slate-500">{{ sub }}</p>{% endif %}
</div>
